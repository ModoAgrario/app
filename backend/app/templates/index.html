<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Modo Agrario">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M32 12v40M32 22c-6 0-10-4-10-8M32 28c-6 0-10-4-10-8M32 34c-6 0-10-4-10-8M32 22c6 0 10-4 10-8M32 28c6 0 10-4 10-8M32 34c6 0 10-4 10-8" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          <span class="brand-text">modoagrario</span>
        </div>
        <button class="icon-btn" aria-label="Filtros">⚙</button>
      </header>

      <p class="hint">Precios desde / hasta por presentación</p>

      <section id="cardsContainer" class="cards"></section>

      <section class="promo-strip">
        <span>💡 Espacio para promo premium sin publicidad.</span>
        <button>Ver planes</button>
      </section>

      <section class="bottom-banner">
        <p>Banner publicitario 320x100 (reservado)</p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
